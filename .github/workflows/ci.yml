name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check exec_org tests
      - run: pytest -q
      - name: The README quickstart runs as written
        run: |
          cd "$(mktemp -d)"
          exec-org init .
          exec-org seats
          EXEC_ARMED=cfo,cto,ciso exec-org brief --dry-run | tee brief.md
          grep -q "## Today's one action" brief.md
