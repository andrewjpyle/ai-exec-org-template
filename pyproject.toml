[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-exec-org-template"
version = "0.2.0"
description = "An AI executive team that cannot act: seats declared in code, one daily engine, drafts only, two dead-man alarms."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Andrew Pyle", email = "apyle0710@gmail.com" }]
keywords = ["ai-agents", "claude", "claude-code", "executive-dashboard", "dead-man-switch", "operations"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Office/Business",
]
dependencies = []

[project.optional-dependencies]
claude = ["anthropic>=0.80"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
exec-org = "exec_org.cli:main"

[project.urls]
Homepage = "https://github.com/andrewjpyle/ai-exec-org-template"
Author = "https://andrewjpyle.com"

[tool.setuptools.packages.find]
include = ["exec_org*"]

[tool.setuptools.package-data]
exec_org = ["templates/*", "templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
